<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club America &mdash; Board Management</title>
  <meta name="description" content="Club America at Park City High School — faith, freedom, and community. Join us at our next meeting." />
  <meta property="og:title" content="Club America — Park City High School" />
  <meta property="og:description" content="Faith, freedom, and community. Join Club America at Park City High School." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Club America — Park City High School" />
  <meta name="twitter:description" content="Faith, freedom, and community. Join Club America at Park City High School." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kaushan+Script&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:  '#0A1628',
            navy2: '#0F1E33',
            navy3: '#16294A',
            red:   '#CC1C2E',
            gold:  '#C9A84C',
            cream: '#F5F0E8',
          },
          fontFamily: {
            display: ['"Bebas Neue"', 'sans-serif'],
            body: ['"DM Sans"', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- React + Babel (no build step required) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"
    onerror="(window.__cdnErrors=window.__cdnErrors||[]).push('React')"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    onerror="(window.__cdnErrors=window.__cdnErrors||[]).push('ReactDOM')"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"
    onerror="(window.__cdnErrors=window.__cdnErrors||[]).push('Babel')"></script>

  <style>
    body { background-color: #0A1628; color: #F5F0E8; font-family: "DM Sans", sans-serif; }
    h1,h2,h3,.font-display { letter-spacing: 0.04em; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0A1628; }
    ::-webkit-scrollbar-thumb { background: #16294A; border-radius: 6px; }
    select option { background: #0F1E33; color: #F5F0E8; }
    .ca-center { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px; padding:24px; }
    html { scroll-behavior: smooth; }

    /* ── Entrance animations ── */
    @keyframes ca-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes ca-slide-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes ca-scale-in {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes ca-slide-down {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes ca-pulse-badge {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.3); }
    }

    .ca-fade-in  { animation: ca-fade-in  0.22s ease-out both; }
    .ca-slide-up { animation: ca-slide-up 0.22s ease-out both; }
    .ca-scale-in { animation: ca-scale-in 0.2s cubic-bezier(0.34, 1.15, 0.64, 1) both; }
    .ca-slide-down { animation: ca-slide-down 0.16s ease-out both; }
    .ca-pulse { animation: ca-pulse-badge 1.8s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root" class="min-h-screen">
    <div class="ca-center" id="ca-loading">
      <div style="color:#C9A84C; font-family:sans-serif; font-size:18px;">Loading Club America…</div>
    </div>
  </div>

  <!-- Watchdog: if the app never mounts (e.g. a CDN is blocked), show why instead of a blank screen. -->
  <script>
    window.addEventListener('error', function (e) {
      window.__lastError = (e && e.message) ? e.message : String(e);
    });
    setTimeout(function () {
      var r = document.getElementById('root');
      if (!r || r.getAttribute('data-mounted') === '1') return; // app mounted fine
      var missing = [];
      if (typeof React === 'undefined') missing.push('React');
      if (typeof ReactDOM === 'undefined') missing.push('ReactDOM');
      if (typeof Babel === 'undefined') missing.push('the JSX compiler');
      if (typeof tailwind === 'undefined') missing.push('Tailwind CSS');
      var msg;
      if (missing.length) {
        msg = "Couldn't load required components (" + missing.join(', ') + "). This is almost always an ad-blocker or browser shield blocking scripts. Try turning OFF Brave Shields / your ad blocker for this site, or open it in another browser or network.";
      } else if (window.__lastError) {
        msg = 'The app hit an error: ' + window.__lastError;
      } else {
        msg = 'The app failed to start. Please reload.';
      }
      r.innerHTML =
        '<div class="ca-center" style="font-family:sans-serif;color:#F5F0E8">' +
        '<div style="font-size:42px">⚠️</div>' +
        '<div style="font-size:20px;color:#C9A84C">Club America couldn\'t load</div>' +
        '<div style="max-width:480px;color:#cbd5e1;line-height:1.5">' + msg + '</div>' +
        '<button onclick="location.reload()" style="margin-top:8px;background:#CC1C2E;color:#F5F0E8;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer">Reload</button>' +
        '</div>';
    }, 10000);
  </script>

  <script type="text/babel" src="app.js" data-presets="react"></script>
</body>
</html>
