<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A1628" />
  <title>Club America &mdash; Park City High School</title>
  <meta name="description" content="Club America at Park City High School — faith, freedom, and community. Join us at our next meeting." />
  <meta property="og:title" content="Club America — Park City High School" />
  <meta property="og:description" content="Faith, freedom, and community. Join Club America at Park City High School." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Club America — Park City High School" />
  <meta name="twitter:description" content="Faith, freedom, and community. Join Club America at Park City High School." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kaushan+Script&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:  '#0A1628',
            navy2: '#0F1E33',
            navy3: '#16294A',
            red:   '#CC1C2E',
            gold:  '#C9A84C',
            cream: '#F5F0E8',
          },
          fontFamily: {
            display: ['"Bebas Neue"', 'sans-serif'],
            body: ['"DM Sans"', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- React + Babel (no build step required) -->
  <!-- Babel is pinned to 7.x on purpose: the app is authored for the *classic*
       JSX runtime (React.createElement via the global React UMD build). Babel
       8's preset-react defaults to the *automatic* runtime, which injects an
       `import { jsx } from "react/jsx-runtime"` that no module loader resolves
       here — crashing the page with "import call expects one or two arguments".
       Keep this pinned (or pass runtime: "classic") if you ever bump it. -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"
    onerror="(window.__cdnErrors=window.__cdnErrors||[]).push('React')"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    onerror="(window.__cdnErrors=window.__cdnErrors||[]).push('ReactDOM')"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"
    onerror="(window.__cdnErrors=window.__cdnErrors||[]).push('Babel')"></script>

  <style>
    body { background-color: #0A1628; color: #F5F0E8; font-family: "DM Sans", sans-serif; }
    h1,h2,h3,.font-display { letter-spacing: 0.04em; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0A1628; }
    ::-webkit-scrollbar-thumb { background: #16294A; border-radius: 6px; }
    select option { background: #0F1E33; color: #F5F0E8; }
    .ca-center { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:12px; padding:24px; }
    html { scroll-behavior: smooth; }

    /* ── Entrance animations ── */
    @keyframes ca-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes ca-slide-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes ca-scale-in {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes ca-slide-down {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* Badge pulse: draws the eye a few times, then settles. An infinitely
       pulsing badge reads as noise once you've seen it. */
    @keyframes ca-pulse-badge {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.15); }
    }

    .ca-fade-in  { animation: ca-fade-in  0.22s ease-out both; }
    /* backwards (not "both"): once these entrance animations finish, they must not
       leave a lingering `transform` on the element. Any transform value — even the
       resting translateY(0)/scale(1) the "to" keyframe ends on — makes the browser
       treat this element as the containing block for `position: fixed` descendants,
       so every modal opened from inside it (confirm dialogs, task detail, etc.) gets
       centered relative to this box instead of the viewport, which is what made
       modals appear off-screen and need scrolling to reach. "backwards" keeps the
       pre-animation state applied during any animation-delay (no flash-in), while
       still releasing the transform the instant the animation completes. */
    .ca-slide-up { animation: ca-slide-up 0.22s ease-out backwards; }
    .ca-scale-in { animation: ca-scale-in 0.2s cubic-bezier(0.34, 1.15, 0.64, 1) backwards; }
    .ca-slide-down { animation: ca-slide-down 0.16s ease-out backwards; }
    .ca-pulse { animation: ca-pulse-badge 1.2s ease-in-out 3; }

    /* ── Immersive homepage ──
       Principle: ambient (always-on) motion is limited to a soft star twinkle;
       everything else only moves in response to the user (scroll parallax,
       pointer tilt, hover). Static stars carry their own fixed opacity. */
    @keyframes ca-twinkle {
      0%, 100% { opacity: var(--ca-min, 0.15); }
      50%      { opacity: var(--ca-max, 0.9); }
    }
    .ca-star { position: absolute; border-radius: 9999px; background: #F5F0E8; }
    .ca-star-twinkle {
      animation: ca-twinkle var(--ca-dur, 6s) ease-in-out infinite;
      animation-delay: var(--ca-delay, 0s);
    }
    @keyframes ca-hero-title {
      from { opacity: 0; transform: translateZ(var(--ca-z, 0px)) translateY(28px) scale(0.98); letter-spacing: 0.12em; }
      to   { opacity: 1; transform: translateZ(var(--ca-z, 0px)) translateY(0) scale(1); letter-spacing: 0.04em; }
    }
    .ca-hero-title { animation: ca-hero-title 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes ca-scroll-cue {
      0%, 100% { transform: translateY(0); opacity: 0.45; }
      50%      { transform: translateY(7px); opacity: 0.9; }
    }
    .ca-scroll-cue { animation: ca-scroll-cue 2s ease-in-out infinite; }
    .ca-reveal {
      opacity: 0; transform: translateY(22px);
      transition: opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ca-reveal.is-visible { opacity: 1; transform: translateY(0); }

    /* ── 3D depth (hero tilt + card hover) ── */
    .ca-card3d { transition: transform 0.18s ease-out; will-change: transform; }

    /* Flag stripes — a static texture that fades out toward the top of the hero. */
    .ca-stripes {
      background-image: repeating-linear-gradient(
        -3deg,
        rgba(204,28,46,0.55)   0px  34px,
        rgba(245,240,232,0.16) 34px 68px
      );
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 45%, transparent 100%);
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 45%, transparent 100%);
    }
    @media (prefers-reduced-motion: reduce) {
      .ca-star-twinkle, .ca-scroll-cue, .ca-pulse { animation: none; }
      .ca-reveal { opacity: 1; transform: none; transition: none; }
      .ca-card3d { transform: none !important; transition: none; }
    }
  </style>
</head>
<body>
  <div id="root" class="min-h-screen">
    <div class="ca-center" id="ca-loading">
      <div style="color:#C9A84C; font-family:sans-serif; font-size:18px;">Loading Club America…</div>
    </div>
  </div>

  <!-- Watchdog: if the app never mounts (e.g. a CDN is blocked), show why instead of a blank screen. -->
  <script>
    window.addEventListener('error', function (e) {
      window.__lastError = (e && e.message) ? e.message : String(e);
    });
    setTimeout(function () {
      var r = document.getElementById('root');
      if (!r || r.getAttribute('data-mounted') === '1') return; // app mounted fine
      var missing = [];
      if (typeof React === 'undefined') missing.push('React');
      if (typeof ReactDOM === 'undefined') missing.push('ReactDOM');
      if (typeof Babel === 'undefined') missing.push('the JSX compiler');
      if (typeof tailwind === 'undefined') missing.push('Tailwind CSS');
      var msg;
      if (missing.length) {
        msg = "Couldn't load required components (" + missing.join(', ') + "). This is almost always an ad-blocker or browser shield blocking scripts. Try turning OFF Brave Shields / your ad blocker for this site, or open it in another browser or network.";
      } else if (window.__lastError) {
        msg = 'The app hit an error: ' + window.__lastError;
      } else {
        msg = 'The app failed to start. Please reload.';
      }
      r.innerHTML =
        '<div class="ca-center" style="font-family:sans-serif;color:#F5F0E8">' +
        '<div style="font-size:42px">⚠️</div>' +
        '<div style="font-size:20px;color:#C9A84C">Club America couldn\'t load</div>' +
        '<div style="max-width:480px;color:#cbd5e1;line-height:1.5">' + msg + '</div>' +
        '<button onclick="location.reload()" style="margin-top:8px;background:#CC1C2E;color:#F5F0E8;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer">Reload</button>' +
        '</div>';
    }, 10000);
  </script>

  <!-- Absolute path: the SPA also serves nested routes like /volunteer/123,
       where a relative "app.js" would wrongly resolve to /volunteer/app.js. -->
  <script type="text/babel" src="/app.js" data-presets="react"></script>
</body>
</html>
