<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club America &mdash; Board Management</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kaushan+Script&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:  '#0A1628',
            navy2: '#0F1E33',
            navy3: '#16294A',
            red:   '#CC1C2E',
            gold:  '#C9A84C',
            cream: '#F5F0E8',
          },
          fontFamily: {
            display: ['"Bebas Neue"', 'sans-serif'],
            body: ['"DM Sans"', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- React + Babel (no build step required) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0A1628; color: #F5F0E8; font-family: "DM Sans", sans-serif; }
    h1,h2,h3,.font-display { letter-spacing: 0.04em; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0A1628; }
    ::-webkit-scrollbar-thumb { background: #16294A; border-radius: 6px; }
    select option { background: #0F1E33; color: #F5F0E8; }
  </style>
</head>
<body>
  <div id="root" class="min-h-screen"></div>
  <script type="text/babel" src="app.js" data-presets="react"></script>
</body>
</html>
